<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title data-i18n="opt_page_title">Convox Settings</title>
		<style>
			:root {
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				justify-content: center;
				align-items: flex-start;
				padding: 40px 16px;
				background: #000;
				color: #fff;
				font-family:
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
				line-height: 1.5;
			}
			main {
				width: 100%;
				max-width: 460px;
				display: flex;
				flex-direction: column;
				gap: 24px;
			}
			section {
				background: #111;
				border: 3px solid #fff;
				border-radius: 12px;
				padding: 28px 32px;
			}
			h1,
			h2 {
				color: #ffff00;
				margin: 0 0 16px;
				font-size: 1.3rem;
			}
			label.field-label {
				display: block;
				color: #ffff00;
				font-size: 0.8rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				margin-bottom: 6px;
			}
			input[type="text"],
			input[type="password"],
			select {
				width: 100%;
				padding: 10px 14px;
				background: #000;
				border: 2px solid #fff;
				border-radius: 6px;
				color: #fff;
				font-size: 1rem;
				margin-bottom: 20px;
			}
			input:focus,
			select:focus,
			button:focus {
				outline: 3px solid #4fa3ff;
				outline-offset: 2px;
			}
			.active-field {
				border-color: #ffff00 !important;
			}
			.row {
				display: flex;
				gap: 10px;
			}
			button {
				flex: 1;
				padding: 12px;
				border-radius: 6px;
				font-size: 1rem;
				font-weight: 700;
				cursor: pointer;
			}
			.btn-primary {
				background: #ffff00;
				color: #000;
				border: none;
			}
			.btn-secondary {
				background: #000;
				color: #fff;
				border: 2px solid #fff;
			}
			.status {
				margin-top: 14px;
				min-height: 20px;
				font-size: 0.9rem;
				text-align: center;
			}
			.status.ok {
				color: #00ff00;
			}
			.status.err {
				color: #ff6b6b;
			}
			.mic-row {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-top: 16px;
				font-size: 0.9rem;
			}
			.mic-indicator {
				width: 14px;
				height: 14px;
				border-radius: 50%;
				background: #555;
				flex: none;
			}
			.mic-indicator.listening {
				background: #00ff00;
			}
			.mic-indicator.speaking {
				background: #ffff00;
			}
			.checkbox-row {
				display: flex;
				gap: 10px;
				align-items: flex-start;
				margin-bottom: 20px;
			}
			.checkbox-row input {
				width: 20px;
				height: 20px;
				margin-top: 2px;
				flex: none;
			}
			.lang-status {
				margin-top: 14px;
				font-size: 0.9rem;
			}
			.lang-status p {
				margin: 4px 0;
			}
		</style>
	</head>
	<body>
		<main>
			<!-- Credential setup (used by lib/options.js; IDs must not change) -->
			<section aria-labelledby="login-heading">
				<h1 id="login-heading" data-i18n="opt_login_heading">Convox – Login Setup</h1>

				<label class="field-label" for="username" data-i18n="opt_username_label">Username / EUID</label>
				<input
					id="username"
					type="text"
					autocomplete="username"
					data-i18n-placeholder="opt_username_placeholder"
					placeholder="e.g. abc1234"
				/>

				<label class="field-label" for="password" data-i18n="opt_password_label">Password</label>
				<input
					id="password"
					type="password"
					autocomplete="current-password"
					data-i18n-placeholder="opt_password_placeholder"
					placeholder="Your Canvas password"
				/>

				<div class="row">
					<button id="saveBtn" class="btn-primary" type="button" data-i18n="opt_save_btn">Save</button>
					<button id="clearBtn" class="btn-secondary" type="button" data-i18n="opt_clear_btn">Clear</button>
				</div>

				<div id="status" class="status" role="status" aria-live="polite"></div>

				<div class="mic-row">
					<span id="micIndicator" class="mic-indicator" aria-hidden="true"></span>
					<span id="transcript-display" aria-live="polite"></span>
				</div>
			</section>

			<!-- Language (Spanish support) -->
			<section aria-labelledby="lang-heading">
				<h2 id="lang-heading" data-i18n="opt_lang_heading">Language</h2>

				<label class="field-label" for="langSelect" data-i18n="opt_lang_label">Convox language</label>
				<select id="langSelect">
					<option value="en" data-i18n="opt_lang_en">English</option>
					<option value="es" data-i18n="opt_lang_es">Español (Spanish)</option>
				</select>

				<div class="checkbox-row">
					<input id="translateContent" type="checkbox" />
					<label for="translateContent" data-i18n="opt_translate_content"
						>Read Canvas page content (announcements, messages, pages) in Spanish</label
					>
				</div>

				<div class="row">
					<button id="downloadLangBtn" class="btn-secondary" type="button" data-i18n="opt_download_btn">
						Download Spanish language pack
					</button>
				</div>

				<div id="langStatus" class="lang-status" role="status" aria-live="polite"></div>
			</section>
		</main>

		<script type="module" src="lib/options.js"></script>
	</body>
</html>
